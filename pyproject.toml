[build-system]
requires = ["uv_build >= 0.12.19, <0.13.0"]
build-backend = "uv_build"

[tool.uv]
conflicts = [
	[
		{ extra = "normal" },
		{ extra = "titanx" },
	],
]

[project]
name = "DeepANC"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
description = "Deep ANC: A deep learning approach to active noise control research code"
classifiers = [
	"Development Status :: 3 - Alpha",
	"Programming Language :: Python"
]

[project.optional-dependencies]
normal = [
	"ipykernel==6.29.5",
	"matplotlib==3.10.8",
	"numpy==2.4.2",
	"pandas==3.0.1",
	"progressbar33==2.4",
	"scipy==1.17.0",
	"torch==2.10.0",
	"torchaudio==2.10.0",
	"torchcodec==0.10.0",
	"scikit-learn==1.8.0",
	"librosa==0.11.0",
	"pyroomacoustics",
	"pyprojroot",
	"construct-dataset-from-freesound @ git+https://github.com/koba1in/construct-dataset-from-freesound.git",
]

titanx = [
	"ipykernel==6.29.5",
	"torch==2.0.1",
	"torchaudio==2.0.2",
	"numpy==1.26.4",
	"progressbar33==2.4",
	"matplotlib",
	"pandas",
	"scipy",
	"torchcodec",
	"librosa",
	"pyroomacoustics",
	"pyprojroot",
	"pyarrow>=23, <24",
	"construct-dataset-from-freesound @ git+https://github.com/koba1in/construct-dataset-from-freesound.git",
]

dev = [
	"pytest",
	"ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
