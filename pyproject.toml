[build-system]
requires = ["uv_build >= 0.12.19, <0.13.0"]
build-backend = "uv_build"

[project]
name = "DeepANC"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.9"
description = "Deep ANC: A deep learning approach to active noise control research code"
classifiers = [
	"Development Status :: 3 - Alpha",
	"Programming Language :: Python"
]

[project.optional-dependencies]
nomal = [
	"ipykernel==6.29.5",
	"matplotlib==3.10.8",
	"numpy==2.4.2",
	"pandas==3.0.1",
	"progressbar33==2.4",
	"scipy==1.17.0",
	"torch==2.10.0",
	"torchaudio==2.10.0",
	"torchcodec==0.10.0",
	"scikit-learn==1.8.0",
	"librosa==0.11.0",
	"pyroomacoustics",
]

titanx = [
	"ipykernel==6.29.5",
	"torch==2.0.1",
	"torchaudio==2.0.2",
	"numpy==2.4.2",
	"progressbar33==2.4",
	"matplotlib",
	"pandas",
	"scipy",
	"torchcodec",
	"librosa",
	"pyroomacoustics",
]

dev = [
	"pytest",
	"ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
